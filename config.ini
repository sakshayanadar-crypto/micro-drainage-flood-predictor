; Settings for the Micro-Drainage & Localized Flood Predictor
[server]
port = 8000
refresh_seconds = 900

[database]
; "sqlite" works with no installation (built into Python).
; Change to "mysql" to use MySQL (needs: pip install mysql-connector-python).
engine = sqlite

[mysql]
host = localhost
port = 3306
user = root
password = your_mysql_password
database = flood_predictor
